<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SariSafe – GCash Transaction Recording and Verification</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#007cff">
<meta name="description" content="Offline-first GCash transaction recording, fee calculation, and duplicate reference verification system for sari-sari stores.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SariSafe">
<!--
  SariSafe (CSC 106) – vanilla HTML/CSS/JS, offline-first PWA.
  Storage: IndexedDB "SariSafeDB" (FR-04, NFR-05).
-->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>SariSafe <span class="badge" id="roleBadge">Store Tender</span></h1>
  <div class="hbtns">
    <button class="btn sec sm" id="cloudChip" type="button">☁ Auto-sync ready</button>
    <button class="btn sec sm" id="privacyTopBtn" type="button">🔒 Privacy</button>
    <button class="btn sec sm" id="installBtn" hidden>📲 Install App</button>
    <button class="btn sec sm" id="ownerBtn">Owner login</button>
  </div>
</header>
<nav id="nav"></nav>
<main>
<div id="banners"></div>

<!-- COUNTER (FR-01, FR-02, FR-03, FR-08, FR-09, FR-10) -->
<section id="v-counter">
  <div class="wallet">
    <div class="wl"><span>Expected GCash wallet</span><button id="eye" aria-label="Show or hide balances">👁 Show / hide</button></div>
    <b id="wBal">–</b>
    <div class="wsub"><div><small>Cash drawer</small><span id="wCash">–</span></div><div><small>Shift</small><span id="wShift">–</span></div></div>
  </div>
  <div class="card">
    <h2>New transaction</h2>
    <label for="ref">GCash reference number</label>
    <input id="ref" inputmode="numeric" autocomplete="off">
    <div id="refInd"></div>
    <label>Transaction type</label>
    <div class="seg">
      <label><input type="radio" name="type" value="Cash-In" checked>Cash-In</label>
      <label><input type="radio" name="type" value="Cash-Out">Cash-Out</label>
    </div>
    <div class="row">
      <div><label for="amount">Amount (₱)</label><input id="amount" type="number" inputmode="decimal" min="1" step="0.01">
        <div class="chips" id="chips"><button type="button" data-a="100">₱100</button><button type="button" data-a="200">₱200</button><button type="button" data-a="500">₱500</button><button type="button" data-a="1000">₱1,000</button></div></div>
      <div><label for="fee">Service fee / patong (₱) <span id="feeNote" class="note"></span></label><input id="fee" type="number" inputmode="decimal" min="0" step="0.01"><button type="button" class="btn sec sm" id="feeAuto" hidden style="margin-top:6px">Use auto fee</button></div>
    </div>
    <div class="row">
      <div><label for="cname">Customer name</label><input id="cname" autocomplete="off" placeholder="Full name"></div>
      <div><label for="addr">Address (optional)</label><input id="addr" autocomplete="off" placeholder="e.g. P-1 Sumilihon, Butuan City"></div>
    </div>
    <div class="row">
      <div><label for="phone">Customer phone (09XXXXXXXXX)</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="09123456789"></div>
      <div><label for="status">Status</label><select id="status" disabled><option value="OK">OK</option><option value="Pending">Pending</option><option value="Duplicate">Duplicate</option></select><div id="statusNote" class="note" style="margin-top:4px"></div></div>
    </div>
    <label>Customer signature</label>
    <canvas id="sig" width="600" height="200" tabindex="0" aria-label="Signature pad"></canvas>
    <div class="btns">
      <button class="btn sec sm" id="sigClear">Clear signature</button>
    </div>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:400;font-size:.9rem;cursor:pointer">
      <input type="checkbox" id="custAck" style="width:auto;margin-top:3px">
      <span>I confirm that the mobile number and transaction amount I entered above are accurate, and I agree to the <a href="#privacy" id="privacyInlineLink" class="priv-link">Privacy Policy</a>. (Fuentez Store is not liable for customer input errors.)</span>
    </label>
    <div class="btns"><button class="btn" id="saveTx">Save transaction</button><button class="btn sec" id="resetTx">Clear form</button></div>
  </div>
  <div class="card pend-card" id="pendingBox" hidden>
    <h2>⏳ Pending confirmations <span class="badge pend-badge" id="pendCount">0</span></h2>
    <p class="note">Cash-Out transactions start as <b>Pending</b>. Verify the GCash receipt first, then tap <b>Mark OK</b> to confirm.</p>
    <div class="tw" id="pendingList"></div>
  </div>
  <div class="card"><h2 id="recentTitle">Today's entries</h2><div class="tw" id="recent"></div></div>
</section>

<section id="v-shift" hidden></section>
<section id="v-summary" hidden></section>
<section id="v-log" hidden></section>
<section id="v-settings" hidden></section>
<section id="v-backup" hidden></section>
</main>
<div id="printArea"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const REF_DIGITS=5;
const REF_HINT=REF_DIGITS>=13?"Enter the full 13-digit reference number.":`Enter the last ${REF_DIGITS} digits of the GCash reference number.`;
const $=s=>document.querySelector(s);
const safeSig=s=>/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(s||"")?s:"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=iso=>new Date(iso).toLocaleString("en-PH",{dateStyle:"short",timeStyle:"short"});
const stamp=iso=>{const d=new Date(iso),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};
const day=iso=>new Date(iso).toLocaleDateString("en-CA");
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
function modal(html,cls=""){const d=$("#dlg");d.className=cls;d.innerHTML=html;if(!d.open)d.showModal();return d}
const closeModal=()=>$("#dlg").open&&$("#dlg").close();
async function hashPin(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("sarisafe"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{return"x"+btoa("sarisafe"+p)}}

/* ---------- IndexedDB (FR-04, NFR-05) ---------- */
let D;
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const store=(n,m="readonly")=>D.transaction(n,m).objectStore(n);
const putRaw=(n,v)=>{if(n==="transactions")v.tail=String(v.ref||"").slice(-5);return rq(store(n,"readwrite").put(v))};
const put=(n,v)=>{if(n==="transactions"||n==="shifts")scheduleAutoSync();return putRaw(n,v)};
const all=n=>rq(store(n).getAll());
const byRef=r=>rq(store("transactions").index("ref").getAll(r));
const getSet=async k=>(await rq(store("settings").get(k)))?.value;
const setSet=(k,value)=>putRaw("settings",{key:k,value});
function openDB(){return new Promise((ok,no)=>{
  if(!window.indexedDB)return no(new Error("IndexedDB unavailable"));
  const r=indexedDB.open("SariSafeDB",2);
  r.onupgradeneeded=e=>{const d=r.result;let t;
    if(e.oldVersion<1){t=d.createObjectStore("transactions",{keyPath:"id"});t.createIndex("ref","ref");t.createIndex("ts","ts");d.createObjectStore("shifts",{keyPath:"id"});d.createObjectStore("settings",{keyPath:"key"})}
    else t=r.transaction.objectStore("transactions");
    if(!t.indexNames.contains("tail")){t.createIndex("tail","tail");t.openCursor().onsuccess=ev=>{const c=ev.target.result;if(c){const v=c.value;v.tail=String(v.ref||"").slice(-5);c.update(v);c.continue()}}}};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

/* ---------- state ---------- */
const S={role:"tender",tab:"counter",tiers:[],shift:null,manualFee:false,signed:false,alerted:"",dupOk:"",ownerAuth:null};
const DEFAULT_TIERS=Array.from({length:100},(_,i)=>({min:i*500+1,max:(i+1)*500,fee:(i+1)*10}));
const TABS={tender:[["counter","Counter"],["shift","Shift"]],owner:[["counter","Counter"],["shift","Shift"],["summary","Summary"],["log","Log"],["settings","Fees"],["backup","Backup"]]};

/* ---------- Privacy Policy Modal (RA 10173 / Data Confidentiality) ---------- */
function showPrivacyPolicy(){
  const d=modal(`<div class="detail priv-doc">
    <h2 style="margin-top:0">🔒 SariSafe Privacy &amp; Data Confidentiality Policy</h2>
    <p class="note">Fuentez Store · Brgy. Sumilihon, Butuan City<br>Aligned with the Philippine Data Privacy Act of 2012 (Republic Act No. 10173)</p>
    <h3>1. Information We Collect</h3>
    <p>When processing GCash Cash-In or Cash-Out requests, SariSafe records only the minimum information required for verification: the GCash reference number, transaction type, amount, service fee, customer full name, mobile number, optional address, and customer signature.</p>
    <h3>2. Purpose of Collection</h3>
    <p>Your information is collected strictly to:</p>
    <ul>
      <li>Verify GCash reference numbers and prevent duplicate or fraudulent claims.</li>
      <li>Maintain accurate daily cash drawer and GCash wallet shift reconciliations.</li>
      <li>Provide proof of transaction in case of customer inquiries or disputes.</li>
    </ul>
    <h3>3. Strict Confidentiality &amp; Access Control</h3>
    <ul>
      <li><b>Restricted Tender Access:</b> Store tenders can only record transactions and view their own active shift on the counter device. Tenders cannot view store-wide history, other shifts, or exported reports.</li>
      <li><b>Owner-Only Oversight:</b> Full transaction logs, customer contact details, signatures, and backups are restricted exclusively to the authorized Store Owner.</li>
      <li><b>No Third-Party Sharing:</b> Customer information is never sold, rented, or disclosed to external parties, except when required by law or official GCash dispute resolution.</li>
    </ul>
    <h3>4. Security &amp; Retention</h3>
    <p>All records are transmitted over encrypted HTTPS connections and protected by database Row-Level Security (RLS). Financial entries and signatures are immutable once recorded to prevent unauthorized alteration.</p>
    <h3>5. Customer Rights</h3>
    <p>You may request to review or clarify your recorded transaction details at Fuentez Store by presenting your GCash reference number to the Store Owner.</p>
    <div class="btns"><button class="btn" id="privClose">I understand</button></div>
  </div>`,"view");
  d.querySelector("#privClose").onclick=closeModal;
}
$("#privacyTopBtn").onclick=showPrivacyPolicy;
$("#privacyInlineLink").onclick=e=>{e.preventDefault();showPrivacyPolicy()};

/* ---------- fee tiers & balances (FR-09, FR-11) ---------- */
const calcFee=a=>{const t=S.tiers.find(x=>a>=x.min&&a<=x.max)||S.tiers.find((x,i)=>i>0&&a>S.tiers[i-1].max&&a<x.min);return t?t.fee:null};
const eff=t=>t.type==="Cash-In"?{c:t.amount+t.fee,w:-t.amount}:{c:-t.amount,w:t.amount+t.fee};
const counted=t=>t.status==="OK";
function balances(sh,txs){let c=sh.startCash,w=sh.startWallet;txs.filter(t=>t.shiftId===sh.id&&counted(t)).forEach(t=>{const e=eff(t);c+=e.c;w+=e.w});return{c,w}}
async function refreshShift(){const s=(await all("shifts")).sort((a,b)=>a.startedAt<b.startedAt?1:-1);S.shift=s.find(x=>!x.endedAt&&x.device===S.deviceId)||null;banners()}
async function loadTiers(){
  const saved=await getSet("tiers");
  const isLegacyDefault=Array.isArray(saved)&&saved.length===6&&saved.every((t,i)=>t.min===i*500+1&&t.max===(i+1)*500&&t.fee===(i+1)*10);
  if(!saved||isLegacyDefault){
    S.tiers=DEFAULT_TIERS.map(t=>({...t}));
    if(isLegacyDefault)await setSet("tiers",S.tiers);
  }else{
    S.tiers=validTiers(saved)?saved:DEFAULT_TIERS.map(t=>({...t}));
  }
}

/* ---------- navigation / roles (FR-05, FR-07) ---------- */
function nav(){
  const IC={counter:"M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",shift:"M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z",summary:"M4 20V10M10 20V4M16 20v-7M22 20H2",log:"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",settings:"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6",backup:"M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"};
  $("#nav").innerHTML=TABS[S.role].map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}"><svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg><span>${l}</span></button>`).join("");
  $("#roleBadge").textContent=S.role==="owner"?"Store Owner":"Store Tender";
  $("#ownerBtn").textContent=S.role==="owner"?"Lock owner view":"Owner login";
}
function show(tab){
  if(S.role!=="owner"&&!["counter","shift"].includes(tab))tab="counter";
  S.tab=tab;document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="v-"+tab);nav();
  if(S.role==="owner"&&S.ownerAuth&&["summary","log"].includes(tab))scheduleAutoSync(50);
  ({counter:renderRecent,shift:renderShift,summary:renderSummary,log:renderLog,settings:renderSettings,backup:renderBackup})[tab]();
}
$("#nav").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b)show(b.dataset.tab)};
$("#ownerBtn").onclick=()=>{
  if(S.role==="owner"){
    if(S.ownerAuth?.access_token){
      fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+S.ownerAuth.access_token}}).catch(()=>{});
    }
    S.ownerAuth=null;
    S.role="tender";
    updateCloudBadge();
    show("counter");
    banners();
    toast("Owner view locked.");
    return;
  }
  let pin="";
  const d=modal(`<div class="pinbox"><div class="lock">🔒</div><h3>Store Owner</h3><p class="note">Enter your 4-digit PIN</p>
   <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><p id="pinErr" class="pinErr" aria-live="polite"></p>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<button type="button" class="x" data-k="cancel">Cancel</button><button type="button" class="x" data-k="0">0</button><button type="button" class="x" data-k="back" aria-label="Delete">⌫</button></div></div>`,"pin");
  const paint=()=>d.querySelectorAll("#dots i").forEach((x,i)=>x.classList.toggle("on",i<pin.length));
  const press=async k=>{
    if(k==="cancel"){closeModal();return}
    if(k==="back")pin=pin.slice(0,-1);else if(/^\d$/.test(k)&&pin.length<4)pin+=k;
    $("#pinErr").textContent="";paint();
    if(pin.length<4)return;
    if(await hashPin(pin)===await getSet("pin")){closeModal();S.role="owner";updateCloudBadge();show("summary");banners()}
    else{const dots=$("#dots");$("#pinErr").textContent="Invalid PIN. Try again.";dots.classList.remove("bad");void dots.offsetWidth;dots.classList.add("bad");pin="";setTimeout(()=>{dots.classList.remove("bad");paint()},400)}
  };
  const key=e=>{if(e.key==="Backspace")press("back");else if(/^\d$/.test(e.key))press(e.key)};
  document.addEventListener("keydown",key);
  d.addEventListener("close",()=>document.removeEventListener("keydown",key),{once:true});
  d.querySelector(".pad").onclick=e=>{const k=e.target.dataset.k;if(k!==undefined)press(k)};
};
async function banners(){
  let h="";
  if(!S.shift)h+=`<div class="warn">No shift is open on this device. <a href="#shift" id="goShift" style="font-weight:700;text-decoration:underline;color:inherit">Open the Shift tab to enter your Tender name and start a shift</a> before recording transactions.</div>`;
  if(S.role==="owner"){
    if(await getSet("pinDefault"))h+=`<div class="warn">You are still using the default PIN (1234). Change it under Fees → Change owner PIN.</div>`;
    const e=await storageInfo();if(e&&e.pct>=80)h+=`<div class="warn">Browser storage is ${e.pct.toFixed(0)}% full. Export a backup now (Backup tab).</div>`;
  }
  $("#banners").innerHTML=h;
  const gs=$("#goShift");if(gs)gs.onclick=e=>{e.preventDefault();show("shift")};
}

/* ---------- signature pad (FR-08) ---------- */
const cv=$("#sig"),cx=cv.getContext("2d");let drawing=false;
cx.lineWidth=2.5;cx.lineCap="round";cx.strokeStyle="#14213d";
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke();S.signed=true};
cv.onpointermove=e=>{if(!drawing)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke()};
cv.onpointerup=cv.onpointercancel=()=>drawing=false;
function clearSig(){cx.clearRect(0,0,cv.width,cv.height);S.signed=false}
$("#sigClear").onclick=clearSig;

/* ---------- duplicate lookup (FR-01, FR-02, NFR-01) ---------- */
async function findDup(ref){
  const rows=REF_DIGITS>=13?await byRef(ref):await rq(store("transactions").index("tail").getAll(ref.slice(-5)));
  return rows.filter(t=>t.kind!=="correction")}
function showDup(hits){
  const prev=hits.map(t=>`<li>${fmt(t.ts)} – ${esc(t.name||"—")}, ${esc(t.type)} ${peso(t.amount)} (<span class="st ${esc(t.status)}">${esc(t.status)}</span>)</li>`).join("");
  const d=modal(`<h3>⚠ ${REF_DIGITS<13?"Possible duplicate":"Duplicate reference number!"}</h3><p>${REF_DIGITS<13?`The last ${REF_DIGITS} digits match an earlier transaction. Compare the full GCash receipt before you continue:`:"This 13-digit reference was already recorded:"}</p><ul>${prev}</ul>
  <p><b>${REF_DIGITS<13?"If it is the same receipt, do not process it.":"Do not process this transaction."}</b></p>
  <div class="btns"><button class="btn red" id="dCancel">Cancel entry</button><button class="btn sec" id="dLog">Log as Duplicate attempt</button>${REF_DIGITS<13?'<button class="btn grn" id="dOk">Different receipt – continue</button>':""}</div>`,"alert");
  d.querySelector("#dCancel").onclick=()=>{$("#ref").value="";S.alerted="";S.dupOk="";$("#status").value="OK";indicate("");syncStatusByType();closeModal();$("#ref").focus()};
  d.querySelector("#dLog").onclick=()=>{$("#status").value="Duplicate";$("#status").disabled=true;$("#statusNote").textContent="Flagged as Duplicate attempt.";closeModal();$("#amount").focus()};
  const dOk=d.querySelector("#dOk");if(dOk)dOk.onclick=()=>{S.dupOk=$("#ref").value;$("#status").value="OK";syncStatusByType();closeModal();$("#amount").focus()};
}
function indicate(ref,ms,hits){
  const el=$("#refInd");el.className="";
  if(ref.length<REF_DIGITS){el.textContent=ref.length?`${ref.length}/${REF_DIGITS} digits entered`:REF_HINT;return}
  if(hits&&hits.length){el.className="dup";el.textContent=`${REF_DIGITS<13?"POSSIBLE DUPLICATE":"DUPLICATE"} – already recorded ${fmt(hits[0].ts)} (checked in ${ms} ms)`}
  else{el.className="ok";el.textContent=`No local duplicate found (checked in ${ms} ms)`}
}
$("#ref").oninput=async e=>{
  S.dupOk="";
  const v=e.target.value=e.target.value.replace(/\D/g,"").slice(0,REF_DIGITS);
  if(v.length<REF_DIGITS){S.alerted="";indicate(v);syncStatusByType();return}
  const t0=performance.now(),hits=await findDup(v),ms=Math.round(performance.now()-t0);
  if($("#ref").value!==v)return;
  indicate(v,ms,hits);
  if(hits.length&&S.alerted!==v){S.alerted=v;showDup(hits)}
  else if(!hits.length){S.alerted="";syncStatusByType()}
};

$("#ref").maxLength=REF_DIGITS;$("#ref").placeholder="0".repeat(REF_DIGITS);
document.querySelector('label[for="ref"]').textContent=`GCash reference number (${REF_DIGITS>=13?"13 digits":"last "+REF_DIGITS+" digits"})`;
indicate("");

/* ---------- transaction type status rule ---------- */
function syncStatusByType(){
  const txType=document.querySelector("input[name=type]:checked")?.value||"Cash-In";
  const st=$("#status"),sn=$("#statusNote");
  st.disabled=true;
  if(st.value==="Duplicate"&&S.alerted){
    sn.textContent="Flagged as Duplicate attempt.";
    return;
  }
  if(txType==="Cash-Out"){
    st.value="Pending";
    sn.textContent="Cash-Out is locked to Pending until the tender checks and confirms it.";
  }else{
    st.value="OK";
    sn.textContent="Cash-In is automatically set to OK only.";
  }
}
document.querySelectorAll("input[name=type]").forEach(r=>r.addEventListener("change",syncStatusByType));

/* ---------- fee auto-calc with override (FR-09) ---------- */
$("#amount").oninput=()=>{
  if(S.manualFee)return;const a=parseFloat($("#amount").value),f=a>0?calcFee(a):null;
  $("#fee").value=f===null?"":f;$("#feeNote").textContent=a>0?(f===null?"(no tier – enter manually)":"(auto)"):"";
};
$("#fee").oninput=()=>{S.manualFee=$("#fee").value!=="";$("#feeAuto").hidden=!S.manualFee;if(S.manualFee)$("#feeNote").textContent="(manual override)";else $("#amount").oninput()};
$("#feeAuto").onclick=()=>{S.manualFee=false;$("#feeAuto").hidden=true;$("#fee").value="";$("#amount").oninput()};

function resetForm(){
  ["ref","amount","fee","phone","cname","addr"].forEach(i=>$("#"+i).value="");S.dupOk="";
  document.querySelector('input[name=type][value="Cash-In"]').checked=true;
  $("#custAck").checked=false;
  S.manualFee=false;$("#feeAuto").hidden=true;S.alerted="";$("#feeNote").textContent="";
  $("#status").value="OK";syncStatusByType();clearSig();indicate("");
}
$("#resetTx").onclick=resetForm;

/* ---------- record transaction (FR-03, FR-10) ---------- */
$("#saveTx").onclick=async()=>{
  const txType=document.querySelector("input[name=type]:checked").value;
  const ref=$("#ref").value,amount=parseFloat($("#amount").value),fee=parseFloat($("#fee").value||"0"),phone=$("#phone").value;
  const status=$("#status").value==="Duplicate"?"Duplicate":(txType==="Cash-Out"?"Pending":"OK");
  const err=!new RegExp("^\\d{"+REF_DIGITS+"}$").test(ref)?`Reference number must be exactly ${REF_DIGITS} digits.`
    :!(amount>0)?"Enter a valid amount."
    :!$("#cname").value.trim()?"Enter the customer's name."
    :!(fee>=0)?"Enter a valid service fee."
    :!/^09\d{9}$/.test(phone)?"Phone number must be 11 digits starting with 09."

async function handleTxAction(e,refreshFn){
  const ok=e.target.dataset.ok,fx=e.target.dataset.fix;
  if(ok){
    const [txs,shifts]=await Promise.all([all("transactions"),all("shifts")]);
    const t=txs.find(x=>x.id===ok);
    if(!t)return;
    const origSh=shifts.find(s=>s.id===t.shiftId);
    const reassigned=Boolean(S.shift&&(!t.shiftId||origSh?.endedAt));
    if(reassigned){t.shiftId=S.shift.id;t.tender=S.shift.tender}
    t.status="OK";t.dirty=true;
    (t.statusHistory=t.statusHistory||[]).push({status:"OK",ts:new Date().toISOString(),...(reassigned&&S.shift?{shiftId:S.shift.id,tender:S.shift.tender}:{})});
    await put("transactions",t);await refreshFn();toast("Confirmed OK.");
  }
  if(fx){const t=(await all("transactions")).find(x=>x.id===fx);
    if(!t||t.status!=="OK")return;
    const d=modal(`<h3>Correct entry</h3><p class="note">The original record is kept. A new offsetting entry reverses ${peso(t.amount)} (${esc(t.type)}, ref ${esc(t.ref)}). Record the right values as a new transaction afterward.</p>
    <label for="cn">Reason for correction (required)</label><textarea id="cn" rows="3"></textarea><div class="btns"><button class="btn" id="cOk">Log correction</button><button class="btn sec" id="cNo">Cancel</button></div>`);
    d.querySelector("#cNo").onclick=closeModal;
    d.querySelector("#cOk").onclick=async()=>{const n=d.querySelector("#cn").value.trim();if(!n){toast("An explanatory note is required.");return}
      await put("transactions",{id:uid(),ts:new Date().toISOString(),ref:t.ref,type:t.type,amount:-t.amount,fee:-t.fee,phone:t.phone,name:t.name,addr:t.addr,status:"OK",sig:"",
        shiftId:S.shift?.id||null,tender:S.shift?.tender||"",kind:"correction",device:S.deviceId,corrects:t.id,note:n,statusHistory:[{status:"OK",ts:new Date().toISOString()}]});
      closeModal();await refreshFn();toast("Correction logged.")};
  }
}

/* ---------- owner: summary ---------- */
async function renderSummary(){
  const el=$("#v-summary"),dtFilter=el.dataset.d||"",tnFilter=el.dataset.t||"";
  const allTxs=await all("transactions"),allShifts=await all("shifts");
  const norm=s=>String(s||"").trim();
  const tenderMap=new Map();
  [...allShifts.map(s=>s.tender),...allTxs.map(t=>t.tender)].forEach(raw=>{
    const c=norm(raw);if(!c)return;
    const k=c.toLowerCase();if(!tenderMap.has(k))tenderMap.set(k,c);
  });
  const tenderOptions=[...tenderMap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const activeTenderName=tnFilter?(tenderMap.get(tnFilter)||tnFilter):"";

  const tenderShiftIds=tnFilter?new Set(allShifts.filter(s=>norm(s.tender).toLowerCase()===tnFilter).map(s=>s.id)):null;
  const matchTenderTx=t=>!tnFilter||(norm(t.tender).toLowerCase()===tnFilter||(t.shiftId&&tenderShiftIds.has(t.shiftId)));
  const matchTenderShift=s=>!tnFilter||norm(s.tender).toLowerCase()===tnFilter;

  const filtTxs=allTxs.filter(matchTenderTx);
  const filtShifts=allShifts.filter(matchTenderShift);
  const daySet=new Set([...filtTxs.map(t=>day(t.ts)),...filtShifts.map(s=>day(s.startedAt))]);
  const allDays=[...daySet].sort((a,b)=>a<b?1:-1);
  const visibleDays=dtFilter?allDays.filter(k=>k===dtFilter):allDays;
  const today=day(new Date().toISOString()),yest=day(new Date(Date.now()-864e5).toISOString());
  let n=0;
  const groups=visibleDays.map(k=>{
    const d=filtTxs.filter(t=>day(t.ts)===k),ok=d.filter(counted);
    const sales=ok.filter(t=>t.kind==="sale").length;
    const sum=(ty,f)=>ok.filter(t=>!ty||t.type===ty).reduce((a,t)=>a+Number(t[f]||0),0);
    const feesEarned=sum("","fee");
    const pend=d.filter(t=>t.status==="Pending").length,dups=d.filter(t=>t.status==="Duplicate").length;
    const dayShifts=filtShifts.filter(s=>day(s.startedAt)===k).sort((a,b)=>a.startedAt>b.startedAt?1:-1);
    const lastSh=dayShifts[dayShifts.length-1];
    let endCash="–",endCashSub="No shift recorded",endWallet="–",endWalletSub="No shift recorded";
    if(lastSh){
      const b=balances(lastSh,allTxs);
      if(tnFilter){
        const tLabel=esc(activeTenderName);
        if(lastSh.endedAt){
          endCash=peso(lastSh.countedCash);endCashSub=`After ${tLabel}'s shift close`;
          endWallet=peso(lastSh.countedWallet);endWalletSub=`After ${tLabel}'s shift close`;
        }else{
          endCash=peso(b.c);endCashSub=`${tLabel} (shift still open)`;
          endWallet=peso(b.w);endWalletSub=`${tLabel} (shift still open)`;
        }
      }else{
        if(lastSh.endedAt){
          endCash=peso(lastSh.countedCash);endCashSub="Latest closed shift";
          endWallet=peso(lastSh.countedWallet);endWalletSub="Latest closed shift";
        }else{
          endCash=peso(b.c);endCashSub="Open shift (expected)";
          endWallet=peso(b.w);endWalletSub="Open shift (expected)";
        }
      }
    }
    const lbl=new Date(k+"T00:00:00").toLocaleDateString("en-PH",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
    const tag=k===today?"Today · ":k===yest?"Yesterday · ":"";
    const tenderTitleTag=tnFilter?` · <span style="color:var(--blue)">${esc(activeTenderName)}</span>`:"";
    return `<details class="day" ${n++<2||dtFilter||tnFilter?"open":""}><summary><span>${tag}${lbl}${tenderTitleTag}</span><span class="dc">${sales} transaction${sales===1?"":"s"}</span></summary>
     <div class="kpi">
       <div>Transactions<b>${sales}</b></div>
       <div>Service fees earned<b>${peso(feesEarned)}</b></div>
       <div>Cash-In<b>${peso(sum("Cash-In","amount"))}</b></div>
       <div>Cash-Out<b>${peso(sum("Cash-Out","amount"))}</b></div>
       <div>Physical cash (close)<b>${endCash}</b><small class="note" style="display:block;font-size:.75rem;margin-top:2px">${endCashSub}</small></div>
       <div>GCash balance (close)<b>${endWallet}</b><small class="note" style="display:block;font-size:.75rem;margin-top:2px">${endWalletSub}</small></div>
     </div>
     ${(pend||dups)?`<p class="dev">${pend?`<span class="st Pending">${pend} pending</span>`:""}${pend&&dups?" · ":""}${dups?`<span class="st Duplicate">${dups} duplicate attempt${dups===1?"":"s"}</span>`:""}</p>`:""}
    </details>`;
  }).join("");
  el.innerHTML=`<div class="card"><h2>Daily summary <button class="btn sec sm" id="ssync" style="float:right">⟳ Sync now</button></h2>
   <div class="row" style="align-items:end;max-width:540px;margin-bottom:6px">
     <div><label for="sd">Filter by date (optional)</label><input id="sd" type="date" value="${dtFilter}"></div>
     <div><label for="stender">Filter by tender</label><select id="stender"><option value="">All tenders</option>${tenderOptions.map(([k,label])=>`<option value="${esc(k)}" ${tnFilter===k?"selected":""}>${esc(label)}</option>`).join("")}</select></div>
   </div>
   ${(dtFilter||tnFilter)?`<div style="margin-bottom:8px"><button class="btn sec sm" id="sClear">Reset filters</button></div>`:""}
   <p class="note">${visibleDays.length} day(s) recorded${tnFilter?` for tender <b>${esc(activeTenderName)}</b>`:""}. Corrections are netted into totals.</p>
   ${groups||`<p class="note">No transactions or shifts found for the selected filter.</p>`}</div>`;
  $("#ssync").onclick=()=>triggerOwnerSync(renderSummary);
  $("#sd").onchange=e=>{el.dataset.d=e.target.value;renderSummary()};
  $("#stender").onchange=e=>{el.dataset.t=e.target.value;renderSummary()};
  if($("#sClear"))$("#sClear").onclick=()=>{el.dataset.d="";el.dataset.t="";renderSummary()};
}

async function apiErr(r){let t="";try{const j=await r.clone().json();t=j.message||j.msg||j.error_description||j.error||""}catch{}return r.status+" "+t}
const sb=(token,path,o={})=>fetch(SUPABASE_URL+"/rest/v1/"+path,{
  ...o,
  headers:{
    apikey:SUPABASE_KEY,
    ...(token?{Authorization:"Bearer "+token}:{}),

  }
});

async function sbAuth(email,password){

async function ensureFreshSession(sess){
  if(!sess)return null;
  if(sess.access_token&&sess.expires_at>Date.now())return sess;
  const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:sess.refresh_token})});
  if(!r.ok){
    S.ownerAuth=null;
    throw new Error("Owner cloud session expired. Please sign in again.");
  }
  const j=await r.json();
  S.ownerAuth={...sess,access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000};
  return S.ownerAuth;
}

let syncing=false,syncTimer=null;
function scheduleAutoSync(delay=400){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>runAutoSync(true),delay);
}

async function runAutoSync(silent=false){
  if(syncing)return;
  if(!navigator.onLine){updateCloudBadge();return}

  const isOwner=S.role==="owner"&&Boolean(S.ownerAuth);
  syncing=true;updateCloudBadge("syncing");let changed=false;
  try{
    if(isOwner){
      /* OWNER MODE: Download all devices' records first, then upload local changes */
      const sess=await ensureFreshSession(S.ownerAuth);
      if(!sess||sess.role!=="owner")throw new Error("Owner session required.");

      for(const [n,tbl] of Object.entries(TBL)){
        let lp=await getSet("pull_"+n),first=true;
        for(;;){
          const since=first&&lp?new Date(Date.parse(lp)-60000).toISOString():(lp||"1970-01-01T00:00:00Z");first=false;
          const r=await sb(sess.access_token,`${tbl}?select=id,data,updated_at&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=200`);
          if(!r.ok)throw new Error("Download failed: "+await apiErr(r));
          const rows=await r.json();
          for(const row of rows){
            lp=row.updated_at;const cur=await getRec(n,row.id);
            if(!cur){await putRaw(n,{...row.data,dirty:false,srv:row.updated_at});changed=true;continue}
            if(cur.dirty===false){
              if(cur.srv!==row.updated_at){await putRaw(n,{...row.data,dirty:false,srv:row.updated_at});changed=true}
              continue;
            }
            if(n==="transactions"&&row.data.status==="OK"){await putRaw(n,{...row.data,dirty:false,srv:row.updated_at});changed=true}
            else if(n==="shifts"&&row.data.endedAt){await putRaw(n,{...row.data,dirty:false,srv:row.updated_at});changed=true}
          }
          if(rows.length<200)break;
        }
        if(lp)await setSet("pull_"+n,lp);

        const dirty=(await all(n)).filter(x=>x.dirty!==false);
        for(let i=0;i<dirty.length;i+=20){
          const ch=dirty.slice(i,i+20);
          const rows=ch.map(x=>{const{dirty:_d,srv:_s,...d}=x;return{id:x.id,ts:x.ts||x.startedAt,data:d}});
          const r=await sb(sess.access_token,tbl,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
          if(!r.ok)throw new Error("Upload failed: "+await apiErr(r));
          for(const x of ch){x.dirty=false;await putRaw(n,x)}
        }
      }
    }else{
      /* TENDER MODE (ZERO LOGIN): Upload-only via secure RPC function (no read access) */
      const dirtyTxs=(await all("transactions")).filter(x=>x.dirty!==false);
      const dirtyShifts=(await all("shifts")).filter(x=>x.dirty!==false);
      if(dirtyTxs.length||dirtyShifts.length){
        for(let i=0;i<Math.max(dirtyTxs.length,dirtyShifts.length);i+=20){
          const txChunk=dirtyTxs.slice(i,i+20);
          const shChunk=dirtyShifts.slice(i,i+20);
          const cleanTxs=txChunk.map(x=>{const{dirty:_d,srv:_s,...d}=x;return d});
          const cleanShifts=shChunk.map(x=>{const{dirty:_d,srv:_s,...d}=x;return d});
          const r=await sb(null,"rpc/sarisafe_tender_sync",{
            method:"POST",
            body:JSON.stringify({p_txs:cleanTxs,p_shifts:cleanShifts})
          });
          if(!r.ok)throw new Error("Auto-sync failed: "+await apiErr(r));
          for(const x of txChunk){x.dirty=false;await putRaw("transactions",x)}
          for(const x of shChunk){x.dirty=false;await putRaw("shifts",x)}
        }
      }
    }

    S.lastSync=new Date().toISOString();S.err="";await setSet("lastSync",S.lastSync);
    updateCloudBadge("idle");
    if(changed){
      await refreshShift();
      if(S.tab==="summary")renderSummary();
      else if(S.tab==="log")renderLog();
    }
  }catch(e){
    S.err=e instanceof TypeError?"Cannot reach Supabase (check internet).":(e.message||String(e));
    updateCloudBadge("error");
    if(!silent)throw new Error(S.err);
  }finally{
    syncing=false;
  }
}

     <p style="margin:0 0 4px"><b>1. Tender Auto-Sync (Zero Login):</b> <span class="st OK">Active automatically on all devices</span></p>
     <p class="note" style="margin:0 0 12px">Tenders do not need to log in. Every transaction, shift update, and cash-out confirmation uploads automatically in the background while tenders remain blocked from reading store-wide history.</p>
     <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
     <p style="margin:0 0 4px"><b>2. Owner Full Store View:</b> ${S.ownerAuth?`<span class="st OK">Signed in (${esc(S.ownerAuth.email)})</span>`:`<span class="note">Locked until Owner signs in</span>`}</p>
     <p class="note" style="margin:0 0 8px">${last?"Last sync: "+fmt(last):"Never synced."} Downloads all transactions across every tender device into your Owner dashboard. Clears automatically when you tap <b>Lock owner view</b>.</p>
     <div class="btns" style="margin:0"><button class="btn" id="cSync">Sync all store records now</button></div>
   </div>`;
  $("#v-backup").appendChild(el);
  $("#cSync").onclick=()=>triggerOwnerSync(renderBackup);
}

window.addEventListener("online",()=>{updateCloudBadge();scheduleAutoSync(300)});
window.addEventListener("offline",()=>updateCloudBadge());

/* ---------- install app prompt ---------- */
let installPrompt;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("#installBtn").hidden=true};

/* ---------- start ---------- */
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
  try{D=await openDB()}catch(e){
    document.querySelector("main").innerHTML=`<div class="card"><h2>Storage is unavailable</h2><p>This browser has blocked IndexedDB (for example, in private browsing). Enable site storage or use a normal browser window, then reload.</p></div>`;return}
  if(!(await getSet("pin"))){await setSet("pin",await hashPin("1234"));await setSet("pinDefault",true)}
  S.deviceId=await getSet("deviceId");if(!S.deviceId){S.deviceId=uid();await setSet("deviceId",S.deviceId)}
  await setSet("deviceAuth",null);
  S.lastSync=await getSet("lastSync");
  await loadTiers();await refreshShift();syncStatusByType();show("counter");
  updateCloudBadge();
  scheduleAutoSync(500);
})();
</script>
